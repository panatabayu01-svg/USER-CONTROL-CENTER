  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #102050;
    }

    /* ================================
       HEADER
       ================================ */

    .header {
      background: linear-gradient(115deg, #062b73 0%, #0754a6 48%, #087bd1 100%);
      position: relative;
      overflow: hidden;

      color: white;

      padding: 18px 32px;
      min-height: 82px;
      box-shadow: 0 5px 18px rgba(5,50,110,.18);

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 58px;
      filter: drop-shadow(0 4px 7px rgba(0,0,0,.30));
    }

    .header-icon img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      display: block;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 16px;
      opacity: .95;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .clock {
      font-size: 17px;
      line-height: 1.5;
      text-align: right;
      border-right: 1px solid rgba(255,255,255,.3);
      padding-right: 25px;
    }

    .refresh-btn {
      border: none;
      background: white;
      color: #123b80;

      padding: 14px 26px;

      border-radius: 12px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #eef5ff;
    }

    /* ================================
       MAIN
       ================================ */

    .container {
      padding: 18px 24px 28px;
      max-width: 1400px;
      margin: auto;
    }

    .section {
      background: white;
      border-radius: 16px;
      margin-bottom: 22px;
      overflow: hidden;

      border: 1px solid #dce5ef;

      box-shadow:
        0 3px 12px rgba(0,0,0,.04);
    }

    .section-title {
      padding: 17px 24px;
      min-height: 72px;
      font-size: 22px;
      font-weight: 800;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title.green {
      background: linear-gradient(90deg, #e9fbf3, #f4fffb);
      color: #063c29;
    }

    .section-title.orange {
      background: linear-gradient(90deg, #fff3d6, #fff9ec);
      color: #5b3500;
    }

    .section-title-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .section-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .active-count {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #bff5d9;
      color: #075c2f;
      padding: 9px 18px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(7,148,71,.08);
    }

    .active-count-icon {
      font-size: 18px;
    }

    .waiting-count {
      background: #ffe8af;
      color: #714300;

      padding: 10px 22px;

      border-radius: 25px;

      font-size: 18px;
      font-weight: 700;
    }

    .waiting-count span {
      color: #e22;
      font-size: 24px;
      margin-left: 5px;
    }

    /* ================================
       TABLE
       ================================ */

    .table-wrap {
      padding: 8px 14px 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;

      border: 1px solid #dce5ef;
      border-radius: 12px;
      overflow: hidden;
    }

    th {
      background: #f0f4f9;
      color: #102050;

      font-size: 17px;
      font-weight: 800;

      padding: 16px 14px;

      text-align: center;

      border-bottom: 1px solid #dce5ef;
      white-space: nowrap;
    }

    td {
      padding: 13px 12px;
      text-align: center;

      font-size: 16px;

      border-bottom: 1px solid #e5ebf2;

      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .no {
      width: 60px;
      text-align: center;
    }

    /* ================================
       APPLICATION BADGE
       ================================ */

    .app-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 9px 16px;

      border-radius: 7px;

      font-weight: 700;

      font-size: 15px;
    }

    .app-ekspedisi {
      background: #d9ecff;
      color: #0754a6;
    }

    .app-monitoring {
      background: #d9f5e5;
      color: #075c2f;
    }

    .device-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 58px;
      line-height: 1.05;
    }

    .device-icon {
      font-size: 25px;
      line-height: 1;
    }

    .device-label {
      font-size: 12px;
      font-weight: 800;
      color: #102050;
      margin-top: 2px;
    }

    .online-cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #079447;
      font-weight: 800;
    }

    .online-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #20cf7a;
      box-shadow: 0 0 0 3px rgba(32,207,122,.13);
      flex: 0 0 auto;
    }

    .duration-cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #123b80;
      font-weight: 700;
    }

    .online-time-short {
      display: none;
    }

    /* ================================
       STATUS
       ================================ */

    .online {
      color: #079447;
      font-weight: 800;
    }

    .offline {
      color: #8993a1;
      font-weight: 700;
    }

    .status-pending {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      background: #fff5df;

      padding: 8px 13px;

      border-radius: 8px;

      color: #7b4b00;

      font-weight: 700;
    }

    .status-dot {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #ffb000;
    }

    /* ================================
       BUTTON
       ================================ */

    .approve-btn,
    .reject-btn {

      border: none;

      color: white;

      padding: 11px 20px;

      border-radius: 7px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      min-width: 125px;
    }

    .approve-btn {
      background: #08a65b;
    }

    .approve-btn:hover {
      background: #078c4e;
    }

    .reject-btn {
      background: #f5222d;
      margin-left: 8px;
    }

    .reject-btn:hover {
      background: #d91520;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* ================================
       EMPTY
       ================================ */

    .empty {
      padding: 32px;
      vertical-align: middle;
      text-align: center;
      color: #8792a2;
      font-size: 17px;
    }

    /* ================================
       LOADING
       ================================ */

    .loading {
      position: fixed;

      inset: 0;

      background: rgba(255,255,255,.75);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .loading-box {
      background: white;

      padding: 25px 35px;

      border-radius: 14px;

      box-shadow: 0 8px 30px rgba(0,0,0,.15);

      font-size: 18px;
      font-weight: 700;
    }

        height: 55px;
        font-size: 10.5px;
        line-height: 1.05;
        white-space: normal !important;
        overflow-wrap: anywhere;
        word-break: normal;
        color: #f1f7ff;
        background: #0a2035;
        border-color: rgba(82,161,224,.15);
      }

      /* ACTIVE: 6 kolom */
      .section:first-of-type table th:nth-child(1),
      .section:first-of-type table td:nth-child(1) { width: 7%; }

      .section:first-of-type table th:nth-child(2),
      .section:first-of-type table td:nth-child(2) { width: 25%; }

      .section:first-of-type table th:nth-child(3),
      .section:first-of-type table td:nth-child(3) { width: 19%; }

      .section:first-of-type table th:nth-child(4),
      .section:first-of-type table td:nth-child(4) { width: 12%; }

      .section:first-of-type table th:nth-child(5),
      .section:first-of-type table td:nth-child(5) { width: 21%; }

      .section:first-of-type table th:nth-child(6),
      .section:first-of-type table td:nth-child(6) { width: 16%; }

      /* PENDING: 7 kolom */
      .section:nth-of-type(2) table th:nth-child(1),
      .section:nth-of-type(2) table td:nth-child(1) { width: 6%; }

      .section:nth-of-type(2) table th:nth-child(2),
      .section:nth-of-type(2) table td:nth-child(2) { width: 18%; }

      .section:nth-of-type(2) table th:nth-child(3),
      .section:nth-of-type(2) table td:nth-child(3) { width: 17%; }

      .section:nth-of-type(2) table th:nth-child(4),
      .section:nth-of-type(2) table td:nth-child(4) { width: 11%; }

      .section:nth-of-type(2) table th:nth-child(5),
      .section:nth-of-type(2) table td:nth-child(5) { width: 16%; }

      .section:nth-of-type(2) table th:nth-child(6),
      .section:nth-of-type(2) table td:nth-child(6) { width: 14%; }

      .section:nth-of-type(2) table th:nth-child(7),
      .section:nth-of-type(2) table td:nth-child(7) { width: 18%; }

      /* APP BADGE */
      .app-badge {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 6px 3px;
        gap: 2px;
        border-radius: 7px;
        font-size: 9px;
        line-height: 1.05;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .app-badge > span:first-child {
        font-size: 13px;
        flex: 0 0 auto;
      }

      .app-ekspedisi {
        background: #0c4277;
        color: #8bd0ff;
      }

      .app-monitoring {
        background: #0c4b3b;
        color: #82f2be;
      }

      /* DEVICE */
      .device-cell {
        min-width: 0;
        width: 100%;
        gap: 1px;
      }

      .device-icon {
        font-size: 21px;
      }

      .device-label {
        font-size: 9px;
        color: #eaf5ff;
      }

      /* ONLINE */
      .online-cell {
        width: 100%;
        max-width: 100%;
        gap: 4px;
        font-size: 9.5px;
        color: #42e895;
        line-height: 1.05;
        white-space: normal;
      }

      .online-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        box-shadow: 0 0 0 2px rgba(32,207,122,.13);
      }

      .online-time-full {
        display: none;
      }

      .online-time-short {
        display: inline;
      }

      /* DURASI */
      .duration-cell {
        width: 100%;
        gap: 3px;
        font-size: 9px;
        color: #72c9ff;
        line-height: 1.05;
      }

      .duration-cell > span:first-child {
        font-size: 12px;
      }

      /* STATUS PENDING */
      .status-pending {
        max-width: 100%;
        padding: 4px 3px;
        gap: 3px;
        border-radius: 7px;
        font-size: 8px;
        line-height: 1.05;
        white-space: normal;
        background: #493614;
        color: #ffd779;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
      }

      /* APPROVE / REJECT — tetap berfungsi, dibuat compact */
      .approve-btn,
      .reject-btn {
        display: block;
        width: 100%;
        min-width: 0;
        margin: 2px 0 !important;
        padding: 5px 2px;
        border-radius: 5px;
        font-size: 8px;
        line-height: 1.05;
      }

      .approve-btn {
        background: #079b5a;
      }

      .reject-btn {
        background: #e52a35;
      }

      /* EMPTY */
      .empty {
        padding: 25px 8px;
        font-size: 11px;
        line-height: 1.25;
        color: #8ca7c2;
        white-space: normal !important;
      }

      /* LOADING — HP ONLY
         Pastikan overlay dan teks loading selalu terlihat jelas.
         Tidak mempengaruhi tampilan PC.
      */
      .loading {
        background: rgba(3, 16, 31, .78) !important;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }

      .loading-box {
        padding: 18px 24px !important;
        min-width: 170px;
        border-radius: 14px !important;
        background: linear-gradient(135deg, #082640, #0b3152) !important;
        color: #ffffff !important;
        border: 1px solid rgba(0, 211, 255, .65) !important;
        box-shadow: 0 10px 35px rgba(0, 0, 0, .55) !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        text-align: center;
        text-shadow: 0 1px 3px rgba(0,0,0,.65);
      }

    }
/* ==========================================
   APPROVAL NOTIFICATION — HP + PC
   Tambahan saja, tidak mengubah layout utama
   ========================================== */
#approvalNotify {
  position: fixed;
  left: 50%;
  top: 22px;
  transform: translateX(-50%) translateY(-18px);
  z-index: 99999;
  width: min(420px, calc(100vw - 28px));
  box-sizing: border-box;
  padding: 14px 18px;
  border-radius: 14px;
  background: linear-gradient(135deg, #062744, #0a4770);
  border: 1px solid #00d9ff;
  box-shadow: 0 12px 35px rgba(0,0,0,.45), 0 0 20px rgba(0,217,255,.20);
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
  font-family: inherit;
}
#approvalNotify.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#approvalNotify .approval-title {
  font-weight: 800;
  font-size: 15px;
  color: #00eaff;
  margin-bottom: 5px;
}
#approvalNotify .approval-detail {
  font-size: 13px;
  line-height: 1.45;
  color: #eaf8ff;
}
#approvalNotify .approval-detail b { color: #fff; }
#approvalNotify .approval-close {
  position: absolute;
  top: 7px;
  right: 9px;
  border: 0;
  background: transparent;
  color: #bfefff;
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
}
@media (max-width: 600px) {
  #approvalNotify {
    top: 14px;
    width: calc(100vw - 24px);
    padding: 12px 16px;
    border-radius: 13px;
  }
  #approvalNotify .approval-title { font-size: 14px; }
  #approvalNotify .approval-detail { font-size: 12px; }
}

</style>
</head>

      <button
        class="refresh-btn"
        onclick="refreshData()">

        🔄 Refresh

      </button>

    </div>

  </div>


  <!-- ================================
       CONTENT
       ================================ -->

  <div class="container">


    <!-- ================================
         USER AKTIF
         ================================ -->

    <div class="section">

      <div class="section-title green">

        <div class="section-title-left">

          <div class="section-icon">
            🟢
          </div>

          <div>
            USER AKTIF (SEDANG ONLINE)
          </div>

        </div>

        <div class="active-count">
          <span class="active-count-icon">👥</span>
          <span id="activeCount">0 User Online</span>
        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th class="no">No</th>

              <th>Nama User</th>

    <!-- ================================
         USER MENUNGGU APPROVAL

    <div class="section">

      <div class="section-title orange">

        <div class="section-title-left">

          <div class="section-icon">
            🟠
          </div>

          <div>
            USER MENUNGGU APPROVAL

          Total Menunggu:

          <span id="pendingCount">
            0
          </span>

        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th class="no">No</th>

              <th>Aplikasi</th>

              <th>Nama User</th>

              <th>Device</th>

              <th>Tanggal Registrasi</th>

              <th>Status</th>

              <th>Aksi</th>

            </tr>

          </thead>

          <tbody id="pendingBody">

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- ================================
       LOADING
       ================================ -->

  <div
    class="loading"
    id="loading">

    <div class="loading-box">

      ⏳ Memuat data...

    </div>

  </div>


<script>

  // ==========================================
  // FORMAT TANGGAL
  // ==========================================

  function formatDate(value) {

    if (!value) {
      return '-';
    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return value;
    }

    const dd =
      String(d.getDate()).padStart(2, '0');

    const mm =
      String(d.getMonth() + 1).padStart(2, '0');

    const yyyy =
      d.getFullYear();

    const hh =
      String(d.getHours()).padStart(2, '0');

    const min =
      String(d.getMinutes()).padStart(2, '0');

    return (
      dd + '-' +
      mm + '-' +
      yyyy + ' ' +
      hh + ':' +
      min
    );

  }


  // ==========================================
  // DURASI
  // ==========================================

  function durationFrom(value) {

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return '-';
    }

    let seconds =
      Math.floor(
        (Date.now() - d.getTime()) / 1000
      );

    if (seconds < 0) {
      seconds = 0;
    }

    const hours =
      Math.floor(seconds / 3600);

    seconds %= 3600;

    const minutes =
      Math.floor(seconds / 60);

    seconds %= 60;

    return (
      String(hours).padStart(2, '0') +
      ':' +
      String(minutes).padStart(2, '0') +
      ':' +
      String(seconds).padStart(2, '0')
    );

  }


  // ==========================================
  // APPLICATION BADGE
  // ==========================================

  function applicationBadge(app) {

    const upper =
      String(app || '').toUpperCase();

    if (
      upper.indexOf('EKSPEDISI') >= 0
    ) {

      return `
        <span class="app-badge app-ekspedisi">
          <span>🚚</span> Ekspedisi Material
        </span>
      `;

    }

    return `
      <span class="app-badge app-monitoring">
        <span>📊</span> Monitoring Material
      </span>
    `;

  }


  // ==========================================
  // BACKEND APPS SCRIPT
  // ==========================================
  // GitHub Pages tidak memiliki google.script.run.
  // Komunikasi ke Apps Script dilakukan melalui JSONP.
  const API_URL = 'https://script.google.com/macros/s/AKfycbzMxMKTpS67QUTPcicJ48e_miLpc8p2NPHjZASXxpiMPYpdPxP4h3UtmCR2QvkWr3IYBQ/exec';

  function apiCall(api, params) {
    return new Promise(function(resolve, reject) {
      const callbackName = 'uccCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

      window[callbackName] = function(result) {
        cleanup();
        if (result && result.success === false) {
          reject(new Error(result.error || 'Request gagal.'));
          return;
        }
        resolve(result);
      };

      const script = document.createElement('script');

      function cleanup() {
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      script.onerror = function() {
        cleanup();
        reject(new Error('Tidak dapat terhubung ke server Apps Script.'));
      };

      const query = new URLSearchParams(params || {});
      query.set('api', api);
      query.set('callback', callbackName);
      query.set('ts', Date.now());

      script.src = API_URL + '?' + query.toString();
      document.body.appendChild(script);
    });
  }

  // ==========================================
  // LOAD DATA
  // ==========================================

  function loadData() {

    showLoading(true);

    apiCall('getData')

      .then(function(result) {

        const data = result.data || {};

        renderActive(data.active || []);
        renderPending(data.pending || []);
        setApprovalPendingBaseline(data.pending || []);

        document.getElementById('pendingCount').textContent =
          (data.pending || []).length;

        updateClock();
        showLoading(false);

      })

      .catch(function(error) {

        showLoading(false);

        alert(
          'Gagal memuat data:\n' +
          (error.message || error)
        );

      });

  }


  // ==========================================
  // DEVICE DISPLAY — TAMPILAN SAJA
  // ==========================================

  function deviceDisplay(value) {

    const raw = String(value || '').trim();
    const upper = raw.toUpperCase();

    let icon = '💻';
    let label = raw || '-';

    if (upper.indexOf('HP') >= 0 || upper.indexOf('MOBILE') >= 0 || upper.indexOf('ANDROID') >= 0 || upper.indexOf('IPHONE') >= 0) {
      icon = '📱';
      label = 'HP';
    } else if (upper.indexOf('TABLET') >= 0 || upper.indexOf('IPAD') >= 0) {
      icon = '▣';
      label = 'TABLET';
    } else if (upper.indexOf('LAPTOP') >= 0) {
      icon = '💻';
      label = 'LAPTOP';
    } else if (upper.indexOf('PC') >= 0 || upper.indexOf('DESKTOP') >= 0) {
      icon = '🖥️';
      label = 'PC';
    }

    return `<span class="device-cell"><span class="device-icon">${icon}</span><span class="device-label">${escapeHtml(label)}</span></span>`;
  }



  // ==========================================
  // USER AKTIF
  // ==========================================

  // ==========================================
  // WAKTU ONLINE — TAMPILAN COMPACT HP
  // ==========================================

  function shortOnlineTime(value) {

    const text = String(value || '').trim();
    const match = text.match(/(\d{1,2}:\d{2})(?::\d{2})?$/);

    if (match) {
      return match[1];
    }

    return text;

  }

  function renderActive(data) {

    const body =
      document.getElementById(
        'activeBody'
      );

    body.innerHTML = '';

    const countEl = document.getElementById('activeCount');
    if (countEl) {
      countEl.textContent = `${data.length} User Online`;
    }

    if (!data.length) {

      body.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            Tidak ada user yang sedang online.
          </td>
        </tr>
      `;

      return;

    }


    data.forEach(function(user, index) {

      const tr =
        document.createElement('tr');

      tr.innerHTML = `

        <td class="no">
          ${index + 1}
        </td>

        <td>
          ${applicationBadge(user.aplikasi)}
        </td>

        <td>
          <strong>
            ${escapeHtml(user.nama)}
          </strong>
        </td>

        <td>
          ${deviceDisplay(user.perangkat)}
        </td>

        <td>
          <span class="online-cell">
            <span class="online-dot"></span>
            <span class="online-time-full">${escapeHtml(user.lastOnline)}</span>
            <span class="online-time-short">${escapeHtml(shortOnlineTime(user.lastOnline))}</span>
          </span>
        </td>

        <td>
          <span class="duration-cell">
            <span>◷</span>
            ${escapeHtml(user.durasi)}
          </span>
        </td>

      `;

      body.appendChild(tr);

    });

  }


  // ==========================================
  // USER PENDING
  // ==========================================

  function renderPending(data) {

    const body =
      document.getElementById(
        'pendingBody'
      );

    body.innerHTML = '';

    if (!data.length) {

      body.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            Tidak ada user yang menunggu approval.
          </td>
        </tr>
      `;

      return;

    }


    data.forEach(function(user, index) {

      const tr =
        document.createElement('tr');

      tr.innerHTML = `

        <td class="no">
          ${index + 1}
        </td>

        <td>
          ${applicationBadge(user.aplikasi)}
        </td>

        <td>
          <strong>
            ${escapeHtml(user.nama)}
          </strong>
        </td>

        <td>
          ${deviceDisplay(user.perangkat)}
        </td>

        <td>
          ${escapeHtml(user.tanggalDaftar)}
        </td>

        <td>

          <span class="status-pending">

            <span class="status-dot"></span>

            Menunggu Approval

          </span>

        </td>

        <td>

          <button
            class="approve-btn"
            onclick="approveUser(this, '${encodeURIComponent(user.aplikasi)}', '${encodeURIComponent(user.idDevice)}')">

            ✓ Approve

          </button>

          <button
            class="reject-btn"
            onclick="rejectUser(this, '${encodeURIComponent(user.aplikasi)}', '${encodeURIComponent(user.idDevice)}')">

            ✕ Reject

          </button>

        </td>

      `;

      body.appendChild(tr);

    });

  }


  // ==========================================
  // APPROVE
  // ==========================================

  function approveUser(
    button,
    aplikasi,
    idDevice
  ) {

    aplikasi =
      decodeURIComponent(aplikasi);

    idDevice =
      decodeURIComponent(idDevice);


    const nama =
      button
        .closest('tr')
        .children[2]
        .innerText;


    if (
      !confirm(
        'Approve user "' +
        nama +
        '"?'
      )
    ) {
      return;
    }


    disableRowButtons(button);


    apiCall('approve', {
      aplikasi: aplikasi,
      idDevice: idDevice
    })
      .then(function(result) {
        alert('✅ User berhasil APPROVED.');
        loadData();
      })
      .catch(function(error) {
        enableRowButtons(button);
        alert('Gagal Approve:\n' + (error.message || error));
      });

  }


  // ==========================================
  // REJECT
  // ==========================================

  function rejectUser(
    button,
    aplikasi,
    idDevice
  ) {

    aplikasi =
      decodeURIComponent(aplikasi);

    idDevice =
      decodeURIComponent(idDevice);


    const nama =
      button
        .closest('tr')
        .children[2]
        .innerText;


    if (
      !confirm(
        'Reject user "' +
        nama +
        '"?'
      )
    ) {
      return;
    }


    disableRowButtons(button);


    apiCall('reject', {
      aplikasi: aplikasi,
      idDevice: idDevice
    })
      .then(function(result) {
        alert('❌ User berhasil REJECTED.');
        loadData();
      })
      .catch(function(error) {
        enableRowButtons(button);
        alert('Gagal Reject:\n' + (error.message || error));
      });

  }


  // ==========================================
  // BUTTON CONTROL
  // ==========================================

  function disableRowButtons(button) {

    const row =
      button.closest('tr');

    row
      .querySelectorAll('button')
      .forEach(function(btn) {

        btn.disabled = true;

      });

  }


  function enableRowButtons(button) {

    const row =
      button.closest('tr');

    row
      .querySelectorAll('button')
      .forEach(function(btn) {

        btn.disabled = false;

      });

  }


  // ==========================================
  // REFRESH
  // ==========================================

  function refreshData() {

    loadData();

  }



  // ==========================================
  // NOTIFIKASI USER BARU MENUNGGU APPROVAL
  // Popup + suara pendek.
  // Tidak muncul pada pemuatan pertama jika
  // data pending memang sudah ada.
  // ==========================================

  let approvalPendingBaseline = null;
  let approvalNotifyTimer = null;
  let approvalAudioContext = null;

  function pendingUserKey(user) {
    return [
      String(user && user.aplikasi || ''),
      String(user && user.idDevice || ''),
      String(user && user.nama || '')
    ].join('||');
  }

  function setApprovalPendingBaseline(list) {
    approvalPendingBaseline = new Set(
      (list || []).map(pendingUserKey)
    );
  }

  function unlockApprovalSound() {
    try {
      if (!approvalAudioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        approvalAudioContext = new AudioCtx();
      }
      if (approvalAudioContext.state === 'suspended') {
        approvalAudioContext.resume();
      }
    } catch (e) {}
  }

  function playApprovalSound() {
    try {
      unlockApprovalSound();
      if (!approvalAudioContext) return;

      const ctx = approvalAudioContext;
      if (ctx.state === 'suspended') return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1174, now + 0.10);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.34);
    } catch (e) {}
  }

  function showApprovalNotification(newUsers) {
    if (!newUsers || !newUsers.length) return;

    let box = document.getElementById('approvalNotify');

    if (!box) {
      box = document.createElement('div');
      box.id = 'approvalNotify';
      box.innerHTML = `
        <button class="approval-close" type="button"
                aria-label="Tutup">×</button>
        <div class="approval-title">🔔 USER BARU MENUNGGU APPROVAL</div>
        <div class="approval-detail"></div>
      `;
      document.body.appendChild(box);

      box.querySelector('.approval-close').addEventListener('click', function () {
        box.classList.remove('show');
      });
    }

    const first = newUsers[0] || {};
    const extra = newUsers.length > 1
      ? ` + ${newUsers.length - 1} user lainnya`
      : '';

    const app = escapeHtml(first.aplikasi || '-');
    const name = escapeHtml(first.nama || '-');

    box.querySelector('.approval-detail').innerHTML =
      `<b>${name}</b> — ${app}${extra}`;

    box.classList.add('show');

    clearTimeout(approvalNotifyTimer);
    approvalNotifyTimer = setTimeout(function () {
      box.classList.remove('show');
    }, 7000);

    playApprovalSound();
  }

  function checkNewApprovalUsers(list) {
    const current = list || [];

    // Pemuatan pertama: hanya simpan baseline.
    if (approvalPendingBaseline === null) {
      setApprovalPendingBaseline(current);
      return;
    }

    const newUsers = current.filter(function (user) {
      return !approvalPendingBaseline.has(pendingUserKey(user));
    });

    setApprovalPendingBaseline(current);

    if (newUsers.length) {
      showApprovalNotification(newUsers);
    }
  }

  // Browser biasanya mengizinkan suara setelah ada interaksi
  // pertama dari Owner. Popup tetap akan muncul jika suara
  // diblokir oleh kebijakan browser.
  document.addEventListener('pointerdown', unlockApprovalSound, { once: true });
  document.addEventListener('touchstart', unlockApprovalSound, { once: true });


  // ==========================================
  // AUTO REFRESH
  // PC + HP
  // Refresh data silently so the user does not
  // need to press the Refresh button when a new
  // approval request arrives.
  // ==========================================

  let autoRefreshBusy = false;

  function autoRefreshData() {

    if (autoRefreshBusy) return;

    autoRefreshBusy = true;

    apiCall('getData')

      .then(function(result) {

        const data = result.data || {};

        renderActive(data.active || []);
        renderPending(data.pending || []);
        checkNewApprovalUsers(data.pending || []);

        const pendingCount =
          document.getElementById('pendingCount');

        if (pendingCount) {
          pendingCount.textContent =
            (data.pending || []).length;
        }

        updateClock();

      })

      .catch(function() {
        // Auto refresh dibuat silent.
        // Error background tidak mengganggu user.
      })

      .finally(function() {
        autoRefreshBusy = false;
      });

  }


  // ==========================================
  // CLOCK
  // ==========================================

  function updateClock() {

    const now =
      new Date();

    const days = [
      'Minggu',
      'Senin',
      'Selasa',
      'Rabu',
      'Kamis',
      'Jumat',
      'Sabtu'
    ];

    const months = [
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember'
    ];

    const text =
      days[now.getDay()] +
      ', ' +
      String(now.getDate()).padStart(2, '0') +
      ' ' +
      months[now.getMonth()] +
      ' ' +
      now.getFullYear() +
      '<br>' +
      String(now.getHours()).padStart(2, '0') +
      ':' +
      String(now.getMinutes()).padStart(2, '0') +
      ':' +
      String(now.getSeconds()).padStart(2, '0');


    document.getElementById(
      'clock'
    ).innerHTML = text;

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  // ==========================================
  // LOADING
  // ==========================================

  function showLoading(show) {

    document.getElementById(
      'loading'
    ).style.display =
      show ? 'flex' : 'none';

  }


  // ==========================================
  // START
  // ==========================================

  window.onload = function() {

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    // Muat data langsung saat aplikasi pertama dibuka.
    loadData();

    // Auto refresh PC + HP setiap 10 detik.
    // Tidak menampilkan loading overlay dan tidak
    // mengubah tampilan HP.
    setInterval(
      autoRefreshData,
      10000
    );

  };

</script>
